# TODO(Haoyu): Maintain repository-root build and verification checks.
name: starter-checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - run: npm install -g pnpm@11.25.0
      - run: make setup vet test test-race build smoke
      - run: python3 scripts/check_scaffold.py
